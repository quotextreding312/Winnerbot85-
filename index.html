<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winnerbot - Live Trading Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0e14; color: #e1e6ed; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .card { background: #151a23; border: 1px solid #232a3b; border-radius: 12px; width: 100%; max-width: 480px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2 { text-align: center; color: #00e676; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; }
    .form-group { margin-bottom: 15px; }
    label { font-size: 14px; color: #8b9bb4; display: block; margin-bottom: 6px; }
    select, button { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
    select { background: #1c2333; color: #fff; border: 1px solid #2c354a; }
    button { background: #00e676; color: #000; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #00c853; }
    .result-box { margin-top: 20px; background: #1c2333; border-radius: 8px; padding: 16px; text-align: center; border: 1px solid #2c354a; }
    .signal { font-size: 24px; font-weight: bold; margin: 10px 0; }
    .buy { color: #00e676; }
    .sell { color: #ff5252; }
    .neutral { color: #ffb300; }
    .info { font-size: 13px; color: #8b9bb4; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>WINNERBOT v2.0</h2>
    
    <div class="form-group">
      <label for="asset">Select Market Asset (Live/Non-OTC):</label>
      <select id="asset">
        <option value="BTCUSDT">BTC / USDT (Crypto)</option>
        <option value="ETHUSDT">ETH / USDT (Crypto)</option>
        <option value="SOLUSDT">SOL / USDT (Crypto)</option>
        <option value="BNBUSDT">BNB / USDT (Crypto)</option>
      </select>
    </div>

    <button onclick="getSignal()">SCAN HIGH-ACCURACY SIGNAL</button>

    <div class="result-box">
      <div id="status" class="info">Click SCAN to analyze market</div>
      <div id="signal" class="signal neutral">WAITING</div>
      <div id="details" class="info">RSI: -- | EMA 200: --</div>
    </div>
  </div>

  <script>
    async function getSignal() {
      const asset = document.getElementById('asset').value;
      const signalEl = document.getElementById('signal');
      const statusEl = document.getElementById('status');
      const detailsEl = document.getElementById('details');

      statusEl.innerText = "Analyzing live candles from Binance...";
      signalEl.innerText = "LOADING...";
      signalEl.className = "signal neutral";

      try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${asset}&interval=1m&limit=200`);
        const data = await res.json();
        
        const closes = data.map(candle => parseFloat(candle[4]));
        const currentPrice = closes[closes.length - 1];
        
        // Calculate RSI (14)
        let gains = 0, losses = 0;
        for (let i = closes.length - 14; i < closes.length; i++) {
          let diff = closes[i] - closes[i - 1];
          if (diff >= 0) gains += diff;
          else losses -= diff;
        }
        let avgGain = gains / 14;
        let avgLoss = losses / 14;
        let rs = avgGain / (avgLoss || 1);
        let rsi = 100 - (100 / (1 + rs));

        // Calculate EMA (200) approx
        let sum = closes.reduce((a, b) => a + b, 0);
        let ema200 = sum / closes.length;

        // Signal Logic
        let signalText = "NEUTRAL / WAIT";
        let signalClass = "neutral";

        if (rsi < 35 && currentPrice > ema200) {
          signalText = "STRONG CALL (BUY)";
          signalClass = "buy";
        } else if (rsi > 65 && currentPrice < ema200) {
          signalText = "STRONG PUT (SELL)";
          signalClass = "sell";
        } else if (rsi < 30) {
          signalText = "CALL (WEAK)";
          signalClass = "buy";
        } else if (rsi > 70) {
          signalText = "PUT (WEAK)";
          signalClass = "sell";
        }

        statusEl.innerText = "Market Analysis Complete";
        signalEl.innerText = signalText;
        signalEl.className = "signal " + signalClass;
        detailsEl.innerText = `Price: ${currentPrice.toFixed(2)} | RSI: ${rsi.toFixed(1)}`;

      } catch (err) {
        statusEl.innerText = "Error fetching market data. Try again.";
        signalEl.innerText = "ERROR";
      }
    }
  </script>
</body>
</html>
